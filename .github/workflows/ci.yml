name: CI

# `developpement` est la branche de travail quotidien : la CI y tourne aussi, sinon
# rien n'est vérifié sur GitHub entre deux merges vers `main` (staging).
on:
  push:
    branches: [main, developpement]
  pull_request:
    branches: [main, developpement]

# Cancel les runs précédents sur la même PR pour économiser les minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job rapide qui fail tôt sur les violations critiques (audit statique).
  # Pas de cache install lourd : si un endpoint est cassé, on le sait en < 30s.
  audit:
    name: Audit (tenant + migrations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Audit statique des endpoints : tous doivent appeler getTenantIdFromEvent
      # et filtrer par tenantId dans leurs queries Drizzle.
      - name: Audit isolation tenant
        run: pnpm audit:tenant

      # Audit du journal Drizzle : cohérence fichiers SQL ↔ _journal.json,
      # ordre chronologique, contenu non vide.
      - name: Audit migrations
        run: pnpm audit:migrations

  # Lint + typecheck en parallèle
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  # Tests + couverture (le plus long)
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: audit  # ne lance pas les tests si l'audit fail
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests + coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Smoke e2e du chemin critique complet (login → vente → clôture → vérification
  # NF525), contre un build de production réel + une base Postgres jetable migrée
  # et seedée. Voir e2e/README.md.
  #
  # NON-BLOQUANT pour l'instant (continue-on-error) : scénario neuf, on observe sa
  # stabilité avant de le rendre bloquant.
  # TODO(suivi) : ouvrir une issue « rendre le job e2e bloquant » et la référencer
  # ici ; retirer continue-on-error après ~2 semaines sans flakiness constatée.
  #
  # DÉSACTIVÉ PAR DÉFAUT (2026-11-10) : ce job a besoin d'un projet Supabase dédié aux
  # tests et de 5 secrets E2E_*, qui n'existent pas encore (plan gratuit limité à deux
  # projets : dev et staging). Sans eux il échouerait à chaque push pour rien. Il est donc
  # sauté tant que la variable de dépôt E2E_ENABLED ne vaut pas 'true'.
  # Pour l'activer, une fois les secrets posés :  gh variable set E2E_ENABLED --body true
  # (Le contexte `secrets` n'est pas lisible dans un `if` de job, d'où la variable.)
  e2e:
    name: E2E smoke (non-bloquant)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    if: ${{ vars.E2E_ENABLED == 'true' }}
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fympos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: fympos_e2e
      DB_SSL: 'false'
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      RUN_SEED: '1'
      # Projet Supabase dédié aux tests (jamais dev/staging/prod) — voir e2e/README.md.
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrations (base vierge → rejouable de zéro, cf. baseline 2026-07-06)
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      - name: Build (production)
        run: pnpm build

      - name: Playwright (smoke e2e)
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
